<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <form action="" method="post">
        <label for="nombre">Nombre</label>
        <input type="text" name="nombre" id="nombre" maxlength="5">
        <br>
        <br>
        <label for="ape1">Apellidos</label>
        <input type="text" name="apellidos" id="ape1" placeholder="Introduce el primer apellido">
        
        <h2>Datos</h2>

        <label for="age">Edad</label>
        <input type="number" name="edad" id="age" min="1" max="100">

        <label for="fecha">Fecha de nacimiento</label>
        <input type="date" name="fecha_nacimiento" id="fecha">

        <h2>Enviar información</h2>
        <label for="email">Email</label>
        <input type="email" name="email" id="email">

        <label for="contrasena">Contraseña</label>
        <input type="password" name="contrasena" id="contrasena">
        <br>
        <br>
        <input type="submit" value="ENVIAR">
        <input type="reset" value="BORRAR DATOS ">











    </form>
</body>
</html>
